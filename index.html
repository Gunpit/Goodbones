<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Bones</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0a08; overflow: hidden; font-family: "Palatino Linotype", Palatino, Georgia, serif; user-select: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #sub { position: absolute; left: 120px; right: 120px; bottom: 34px; text-align: center; pointer-events: none; }
  #sub span { display: inline-block; padding: 5px 14px; background: rgba(20,13,7,.82); color: #f6ecd6; font-size: 25px; line-height: 1.3; border-radius: 3px; }
  #sub span.cap { font-style: italic; font-size: 21px; color: #e2d7bb; }
  #sub b { font-weight: normal; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-right: 9px; }
  /* A word that matters. The first time you hear it, the rest of the line lets go and it stays a moment on its own, like "stay" in the prologue. */
  #sub > span { transition: background-color .8s; }
  #sub span span.rest { display: inline; padding: 0; background: none; border-radius: 0; font-size: inherit; color: inherit; transition: opacity .8s; }
  #sub b { transition: opacity .8s; }
  #sub em.key { display: inline-block; font-style: normal; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
  #sub em.key.new { color: #fffdf3; text-shadow: 0 0 12px rgba(255,195,77,.85); animation: keyin .7s ease-out; }
  #sub span.letgo { background-color: rgba(20,13,7,0); }
  #sub span.letgo span.rest, #sub span.letgo b { opacity: 0; }
  #sub span.letgo em.key { text-shadow: 0 1px 3px #000, 0 0 14px rgba(255,195,77,.9); }
  @keyframes keyin { 0% { transform: scale(1.4); } }
  #who { position: absolute; width: 520px; text-align: center; pointer-events: none; color: #fff8e6; font-size: 20px; font-style: italic; text-shadow: 0 1px 3px #000, 0 0 8px #000; transition: opacity .5s; }
  #hover { position: absolute; pointer-events: none; color: #fff8e6; font-size: 19px; font-style: italic; text-shadow: 0 1px 3px #000, 0 0 8px #000; }
  #said { position: absolute; left: 700px; top: 190px; width: 520px; text-align: center; pointer-events: none; color: #fffdf3; font-size: 36px; font-style: italic; letter-spacing: .02em; line-height: 1.15; text-shadow: 0 1px 2px #000, 0 0 12px rgba(0,0,0,.9); overflow-wrap: anywhere; white-space: pre-wrap; }
  #tip { position: absolute; left: 0; right: 0; top: 22px; text-align: center; pointer-events: none; color: #fff8e6; font-size: 20px; font-style: italic; text-shadow: 0 1px 4px #000, 0 0 12px #000; }
  #voices { position: absolute; right: 22px; top: 168px; text-align: right; pointer-events: none; color: #fff8e6; font-size: 19px; font-style: italic; text-shadow: 0 1px 3px #000, 0 0 10px #000; transition: opacity .6s; }
  #meter { position: absolute; left: 50%; top: 10px; width: 260px; height: 6px; margin-left: -130px; background: rgba(24,17,10,.45); border: 1px solid rgba(255,240,205,.5); box-sizing: border-box; pointer-events: none; display: none; }
  #meterfill { height: 100%; width: 0; background: rgba(255,240,205,.85); }
  #map { position: absolute; right: 14px; top: 14px; opacity: .72; pointer-events: none; display: none; }
  #card, #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff8e6; }
  #card { background: #070504; opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  #card.on { opacity: 1; pointer-events: auto; }
  #cardday { font-size: 46px; letter-spacing: .12em; }
  #cardpart { font-size: 22px; font-style: italic; color: #bfb49a; margin-top: 6px; }
  #cardmore { font-size: 18px; font-style: italic; color: #a59a80; margin-top: 30px; }
  #title { position: absolute; inset: 0; color: #fff8e6; overflow: hidden; background: #000; }
  #titlecam { position: absolute; inset: 0; opacity: 0; transform: scale(.36) translateY(-70px); transform-origin: 640px 360px; transition: opacity .7s; }
  #title.seen #titlecam { opacity: 1; }
  #titlecam.in { transform: none; transition: transform 1.15s cubic-bezier(.55, .03, .25, 1), opacity .7s; }
  #titlewall { position: absolute; left: -1800px; top: -800px; width: 4900px; height: 2400px; background-color: #e6d9b6; }
  #titlefork { position: absolute; left: -1340px; top: -250px; width: 680px; height: 900px; transform: rotate(-1.1deg); box-shadow: 8px 18px 40px rgba(40,25,10,.55); }
  #titletable { position: absolute; left: 90px; top: 740px; width: 1100px; height: 620px; }
  #titlefloor { position: absolute; left: -1800px; top: 1190px; width: 4900px; height: 500px; background: linear-gradient(#f1ecde 0, #f1ecde 74px, #6f4a2a 74px, #4c3119 100%); box-shadow: 0 -4px 10px rgba(50,30,10,.25); }
  #titlestage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  #title.gone { opacity: 0; pointer-events: none; }
  #titlephoto { position: absolute; inset: 0; width: 100%; height: 100%; }
  #title h1 { position: absolute; left: 0; right: 0; top: 665px; margin: 0; text-align: center; font: normal 32px/1 "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: .24em; text-indent: .24em; color: #3b2709; text-shadow: 0 1px 0 rgba(255,244,205,.7); white-space: nowrap; pointer-events: none; }
  #doorglow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #doorglow.ready { animation: doorwake 3.4s ease-in-out infinite; }
  #doorglow.on { animation: none; opacity: 1; }
  @keyframes doorwake { 0%, 100% { opacity: .05; } 50% { opacity: .5; } }
  #doorhit { position: absolute; padding: 0; background: none; border: 0; outline: none; cursor: default; pointer-events: none; }
  #doorhit.ready { cursor: pointer; pointer-events: auto; }
  #intro { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 1s; display: flex; align-items: center; justify-content: center; }
  #intro.on { opacity: 1; pointer-events: auto; }
  #introlines { position: relative; width: 1120px; height: 60px; transition: opacity 1s; }
  #introlines.out { opacity: 0; }
  #introlines p { position: absolute; top: 0; margin: 0; max-width: 620px; font-size: 32px; font-style: italic; opacity: 0; transition: opacity 1.1s; }
  #introlines p.on { opacity: 1; }
  #introlines p .rest { transition: opacity 1.1s; }
  #introlines p.letgo .rest { opacity: 0; }
  #introlines p.a { left: 0; text-align: left; }
  #introlines p.b { right: 0; text-align: right; }
  #strain { position: absolute; transform: translateX(-50%); white-space: nowrap; pointer-events: none; font-size: 104px; font-weight: bold; letter-spacing: .03em; line-height: 1; opacity: 0; transition: opacity .6s; }
  #strain.on { opacity: 1; }
  #strain span { display: inline-block; margin: 0 .07em; visibility: hidden; color: #fffdf3; text-shadow: 0 2px 2px #000, 0 0 18px rgba(0,0,0,.9); transform: translateY(var(--y)) rotate(var(--r)) scale(var(--s)); }
  #strain span.gap { width: .45em; }
  #strain span.seen { visibility: visible; }
  #strain span.now { color: #ffc34d; animation: strainpulse .8s ease-in-out infinite; }
  #strain span.said { color: #fffdf3; animation: strainhit .3s ease-out; }
  #strain span.now.said { color: #fffdf3; animation: strainhold .09s linear infinite; }
  #strain span.nope { animation: strainnope .28s linear; }
  @keyframes strainpulse { 50% { transform: translateY(var(--y)) rotate(var(--r)) scale(calc(var(--s) * 1.13)); } }
  @keyframes strainhit { 0% { transform: translateY(var(--y)) rotate(var(--r)) scale(calc(var(--s) * 1.5)); } }
  @keyframes strainhold { 0% { transform: translate(-3px, calc(var(--y) + 2px)) rotate(var(--r)) scale(calc(var(--s) * 1.28)); } 50% { transform: translate(3px, calc(var(--y) - 2px)) rotate(var(--r)) scale(calc(var(--s) * 1.28)); } }
  @keyframes strainnope { 25% { transform: translate(-9px, var(--y)) rotate(var(--r)); } 75% { transform: translate(9px, var(--y)) rotate(var(--r)); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="map" width="236" height="146"></canvas>
  <div id="meter"><div id="meterfill"></div></div>
  <div id="who"></div>
  <div id="said"></div>
  <div id="hover"></div>
  <div id="tip"></div>
  <div id="voices"></div>
  <div id="sub"></div>
  <div id="strain"></div>
  <div id="card"><div id="cardday"></div><div id="cardpart"></div><div id="cardmore"></div></div>
  <div id="intro"><div id="introlines"></div></div>
  <div id="title">
    <div id="titlecam">
      <div id="titlewall"></div>
      <div id="titlefloor"></div>
      <canvas id="titlefork" width="680" height="900"></canvas>
      <canvas id="titletable" width="1100" height="620"></canvas>
      <div id="titlestage">
        <canvas id="titlephoto" width="1280" height="720"></canvas>
        <canvas id="doorglow" width="1280" height="720"></canvas>
        <button id="doorhit" aria-label="Open the front door and play"></button>
        <h1>GOOD BONES</h1>
      </div>
    </div>  </div>
</div>
<script src="lib/three.min.js"></script>
<script src="js/rooms.js"></script>
<script src="js/pictures.js"></script>
<script src="js/house.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/people.js"></script>
<script src="js/hugarms.js"></script>
<script src="js/words.js"></script>
<script src="js/day2.js"></script>
<script src="js/day3.js"></script>
<script src="js/fork.js"></script>
<script src="js/prologue.js"></script>
<script src="js/reactions.js"></script>
<script src="js/heard.js"></script>
<script src="js/chat.js"></script>
<script src="js/speech.js"></script>
<script src="js/epilogue.js"></script>
<script src="js/days.js"></script>
<script src="js/pack.js"></script>
<script src="js/week.js"></script>
</body>
</html>
